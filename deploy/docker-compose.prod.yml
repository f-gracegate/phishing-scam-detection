# Production stack for a single server (pilot scale). Run from the repository root:
#
#   cp deploy/.env.production.example deploy/.env.production   # then fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). Everything else talks on a private
# network. See docs/operations.md for backups, restores, upgrades and key rotation.
name: psd

x-backend: &backend
  build:
    context: ../backend
  env_file: .env.production
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://psd_app:${APP_DB_PASSWORD}@postgres:5432/psd
    MIGRATION_DATABASE_URL: postgresql+psycopg://psd_owner:${POSTGRES_PASSWORD}@postgres:5432/psd
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    COOKIE_SECURE: "true"
    WEB_BASE_URL: https://${APP_DOMAIN}
    LOG_FORMAT: json
    STORAGE_DIR: /data/objects
    FETCHER_URL: http://fetcher:8001
    FETCHER_TOKEN: ${FETCHER_TOKEN}
  volumes:
    - objects:/data/objects
    - ./secrets:/run/secrets:ro
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [private, scan]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks: [private, public]
    depends_on: [web, backend]

  web:
    build:
      context: ../apps/web
      args:
        API_INTERNAL_URL: http://backend:8000
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [private]

  backend:
    <<: *backend
    # Only Caddy (on the private network) reaches the API, so its X-Forwarded-For is trusted.
    command: >
      sh -c "alembic upgrade head && python -m app.cli seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-4}
             --proxy-headers --forwarded-allow-ips='*' --no-server-header --no-access-log"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://psd_app:${APP_DB_PASSWORD}@postgres:5432/psd
      MIGRATION_DATABASE_URL: postgresql+psycopg://psd_owner:${POSTGRES_PASSWORD}@postgres:5432/psd
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COOKIE_SECURE: "true"
      WEB_BASE_URL: https://${APP_DOMAIN}
      LOG_FORMAT: json
      # One JSON line per request (route template, status, duration, request id) instead of
      # uvicorn's plain-text access log.
      LOG_ACCESS: "true"
      STORAGE_DIR: /data/objects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: python -m app.workers.scan
    deploy:
      replicas: ${SCAN_WORKERS:-2}

  fetcher:
    # Visits untrusted websites. No database, Redis or application secrets; reachable only
    # from the backend and workers on the internal "scan" network, with internet access via
    # "egress". It refuses private, loopback and cloud-metadata addresses itself.
    build:
      context: ../backend
    command: uvicorn app.fetcher.service:app --host 0.0.0.0 --port 8001
    environment:
      FETCHER_TOKEN: ${FETCHER_TOKEN}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    networks: [scan, egress]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psd_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: psd
      APP_DB_USER: psd_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psd_owner -d psd"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [private]

  backup:
    # Nightly encrypted backup (see deploy/backup/nightly.sh). Copy /backups off the server.
    build: ./backup
    command: ["/usr/local/bin/nightly.sh"]
    environment:
      PGHOST: postgres
      PGUSER: psd_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: psd
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_DIR: /backups
      OBJECTS_DIR: /data/objects
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - objects:/data/objects:ro
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [private]

networks:
  # Nothing on this network publishes ports; Caddy is the only way in. It is not "internal"
  # because the API and workers must reach the internet (threat-intelligence providers,
  # Paystack, Firebase, email). Restrict egress with the host firewall if your policy requires.
  private:
  public:
  # The fetcher's only link to the platform. Internal: no route to the internet from here.
  scan:
    internal: true
  # Internet access for the fetcher alone. Block the cloud metadata address (169.254.169.254)
  # and private ranges on the host firewall as a second layer.
  egress:

volumes:
  pgdata:
  redis-data:
  objects:
  caddy-data:
  caddy-config:
